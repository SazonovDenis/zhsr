  check_list_template:
    title: "Шаблон чек-листа"
    description: |
      Чек-лист проверки: приёмка вагона, проверка вагонов, медосмотр, инструктаж и т. п.
    columns:
      text_ru:
        title: "Название на русском"
      text_kk:
