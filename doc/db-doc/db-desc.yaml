        title: "Запись расположения"
        description: "wagon_location, открытая актом: прицепка - рейс, отцепка - станция"
      wagon_status:
        title: "Запись состояния"
        description: "wagon_status, открытая актом: прицепка - в пути, отцепка - в простое"

  transfer_act:
    title: "Приём-передача вагонов между депо, станцией и парком отстоя"
    description: |
      Акт приёма-передачи вагонов: откуда и куда - разные расположения одной станции (сама станция, её депо и парки
      отстоя); со станции на станцию не передаётся.
      Передающая сторона: со станции - приёмщик, из депо или парка отстоя - мастер депо.
      Принимающая сторона: на станцию - приёмщик, в депо или парк отстоя - мастер депо.
      Откуда - ровно одно из from_station, from_depot, from_yard; куда - ровно одно из to_station, to_depot, to_yard.
      Расположение вагонов меняется только при статусе "проведён" (принят). Акт можно оформить сразу принятым.
      Отменяется весь акт целиком.
    columns:
      number:
        title: "Номер"
        description: "Уникален"
      from_station:
        title: "Откуда: станция"
      from_depot:
        title: "Откуда: депо"
      from_yard:
        title: "Откуда: парк отстоя"
      to_station:
        title: "Куда: станция"
      to_depot:
        title: "Куда: депо"
      to_yard:
        title: "Куда: парк отстоя"
      work_type:
        title: "Вид работ"
        description: "При передаче для ремонта"
        constants_from: zhsr-database/src/main/resources/db/dict/work_type.tsv
      act_status_type:
        title: "Статус"
        constants_from: zhsr-database/src/main/resources/db/dict/act_status_type.tsv
      transferred_by_usr:
        title: "Кто сдал"
      transferred_dt:
        title: "Когда сдан"
      received_by_usr:
        title: "Кто принял или отказал"
        description: "Пусто, пока приём не подтверждён (когда находится в процессе передачи)"
      received_dt:
        title: "Когда принят или отказано"
        description: "Пусто, пока приём не подтверждён (когда находится в процессе передачи)"
      reject_reason:
        title: "Причина отказа в приёме"
        description: "Заполнена при статусе \"отказ\" и у отменённого акта, если до отмены был отказ"
      act_cancellation:
        title: "Акт отмены"
        description: "Заполнен только при статусе \"отменён\""

