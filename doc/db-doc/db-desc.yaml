title: "Документация по базе данных Zholserik"
subtitle: "Проект zhsr"

diagrams:

  trip:
    title: "Поездки и рейсы"
    tables: [ trip, trip_wagon, route, trip_status_type, usr, wagon_location: { hide_references: [ "trip" ] }, wagon_status ]
    hide_fields: [ "trip_status_type", "usr", "wagon_location", "wagon_status" ]

  usr:
    title: "Сотрудники: роли, депо, службы и категории"
    tables: [ usr, usr_role, role_type, usr_depot, usr_category, depot: { hide_references: [ "station" ] }, service, category_type ]
    hide_fields: [ role_type, depot, service, category_type ]
    top: [ role_type, depot, service, category_type ]

  trip_crew:
    title: "Бригада рейса"
    tables: [ trip, trip_crew, usr, crew_duty_type, wagon, route ]
    hide_fields: [ "crew_duty_type", "wagon", "usr" ]
    top: [ usr ]

  wagon_location_status:
    title: "Вагоны: перемещение и смена состояния"
    description: "Главные журналы для любых изменений вагона. Другие таблицы могут хранить дополнительную информацию, но ссылаются сюда."
    tables: [ wagon_location, wagon_status, wagon: { hide_references: [ "depot" ] }, depot: { hide_references: [ "station" ] }, yard: { hide_references: [ "station" ] }, station, trip, location_type ]
    hide_fields: [ "depot", "yard", "station" , "wagon", "trip", "location_type" ]

  coupling_act:
    title: "Отцепка и прицепка"
    tables: [ wagon, coupling_act, coupling_act_wagon, wagon_location, wagon_status, coupling_type, act_status_type, act_cancellation ]
    hide_fields: [ "wagon", "wagon_location", "wagon_status", "coupling_type", "act_status_type" ]

  transfer_act:
    title: "Передача вагонов между депо, станцией и парком отстоя"
    description: "Акт приёма-передачи вагонов между станцией, её депо и парками отстоя"
    tables: [ wagon: { hide_references: [ "depot" ] }, transfer_act, transfer_act_wagon, act_status_type, act_cancellation, station, depot: { hide_references: [ "station" ] }, yard: { hide_references: [ "station" ] }, wagon_location: { hide_references: [ "station", "depot", "wagon", "yard" ] } ]
    hide_fields: [ "wagon", "act_status_type", "station", "depot", "yard", "wagon_location" ]
    top: [ transfer_act_wagon, act_cancellation, act_status_type ]

  repair_request_data:
    title: "Заявки на ремонт: описание"
    tables: [ repair_request, repair_request_photo, repair_request_note, offline_receipt, fault_type, wagon, severity_type, trip ]
    hide_fields: [ "fault_type", "wagon", "severity_type", "trip" ]

  repair_request_executor:
    title: "Заявки на ремонт: состояние и исполнители"
    tables: [ repair_request, repair_request_executor, repair_request_status, repair_request_info, fault_type, request_status_type, usr, service, role_type ]
    hide_fields: [ "request_status_type", "fault_type", "usr" ]
    top: [ usr ]

  info:
    title: "Текущие состояния"
    description: |
      Для каждого объекта (вагон, заявка на ремонт) в таблицах ***_info хранится одна запись, в которую копируются последние данные со всех версионных таблиц объекта. 
      Предназначены для быстрого построения списков.
    tables: [ wagon_info, wagon, wagon_location, wagon_status, repair_request_info, repair_request: { hide_references: [ "wagon" ] }, repair_request_status, repair_request_executor ]
    hide_fields: [ "wagon", "wagon_location", "wagon_status", "repair_request", "repair_request_status", "repair_request_executor" ]

  system_dict:
    title: "Справочники: системные константы"
    description: "Значения отражены в константах кода (kz.zhsr.app.constants) и меняются только вместе с кодом. Данные - zhsr-database/src/main/resources/db/dict/*.tsv, загружаются при создании БД. В администрировании не редактируются."
    tables: [ role_type, service, category_type, transport_type, location_type, trip_status_type, crew_duty_type, coupling_type, act_status_type, work_type, wagon_status_type, request_status_type, severity_type ]

  fault_type:
    title: "Справочник: типы неисправностей"
    tables: [ fault_type, fault_group_type, severity_type, service, role_type ]
    hide_fields: [ "role_type" ]

  wagon:
    title: "Справочник: вагоны"
    tables: [ wagon, wagon_type, model_type, depot, station ]

  route:
    title: "Справочник: маршруты"
    tables: [ route, route_station, depot, station, transport_type ]
    hide_fields: [ "transport_type" ]

  stage:
    title: "Железные дороги: станции и перегоны"
    description: "Граф: станции - вершины, перегоны - рёбра."
    tables: [ station, stage, stage_point, route_station, route ]
    hide_fields: [ "route" ]

tables:

  role_type:
    title: "Роль сотрудника"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/role_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"
      service:
        title: "Служба роли"
        description: "Пусто - роль не относится к службе"
        constants_from: zhsr-database/src/main/resources/db/dict/service.tsv

  usr_role:
    title: "Роли сотрудника"
    description: |
      Роли сотрудника в Системе; права из tz.actors.md проверяются по ним. Роль - один раз на сотрудника.
    columns:
      usr:
        title: "Сотрудник"
      role_type:
        title: "Роль"
        constants_from: zhsr-database/src/main/resources/db/dict/role_type.tsv

  category_type:
    title: "Категория проводника"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/category_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  usr_category:
    title: "Категория проводника у сотрудника"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущая запись. У сотрудника в каждый момент не больше
      одной категории.
    columns:
      usr:
        title: "Сотрудник"
      category_type:
        title: "Категория"
        constants_from: zhsr-database/src/main/resources/db/dict/category_type.tsv
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"

  usr_depot:
    title: "Депо сотрудника"
    description: |
      В каком депо работает сотрудник; у каждого сотрудника есть текущее депо. Запись действует с dbeg по dend
      (не включая); dend пуст - текущая запись. Сотрудник в каждый момент работает не больше чем в одном депо.
    columns:
      usr:
        title: "Сотрудник"
      depot:
        title: "Депо"
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"

  usr:
    title: "Сотрудник"
    description: |
      Пользователь компании.
    columns:
      login:
        title: "Логин"
        description: "Уникален. Как привило ИИН"
      full_name:
        title: "ФИО"
      password_hash:
        title: "Хэш пароля"
      phone:
        title: "Телефон"
        description: "В формате +7XXXXXXXXXX"
      disabled:
        title: "Учётная запись отключена"
        description: "Войти нельзя. Сотрудник не удаляется, а отключается: история остаётся"
      change_password:
        title: "Сменить пароль при входе"
        description: "Пароль задал администратор или пароль по умолчанию. Пока пароль не сменён, сервер разрешает только смену пароля"
      created_dt:
        title: "Когда заведён"

  depot:
    title: "Депо"
    description: |
      Депо приписки вагонов компании.
    columns:
      code:
        title: "Код депо"
        description: "Уникален в компании"
      name:
        title: "Название на русском"
      name_kk:
        title: "Название на казахском"
      name_en:
        title: "Название на английском"
      station:
        title: "Расположение депо"
        description: "Задаёт территориальную привязку"

  yard:
    title: "Парк отстоя"
    description: |
      Место расположения вагонов при станции, как депо.
    columns:
      code:
        title: "Код парка отстоя"
        description: "Уникален в компании"
      name:
        title: "Название"
      station:
        title: "Расположение парка отстоя"
        description: "Задаёт территориальную привязку"

  wagon:
    title: "Вагон"
    description: Каталог вагонов в учете компании.
    columns:
      number:
        title: "Номер вагона"
        description: "Уникален в компании"
      wagon_type:
        title: "Тип вагона"
        constants_from: db-data/default/04-wagon_type.tsv
      model_type:
        title: "Модель"
        constants_from: db-data/default/05-model_type.tsv
      build_year:
        title: "Год постройки"
      maker:
        title: "Завод-изготовитель"
      dbeg:
        title: "Дата ввода в эксплуатацию"
      dend:
        title: "Дата вывода из эксплуатации"
        description: "Пусто - вагон в эксплуатации"
      depot:
        title: "Депо приписки"
      data:
        title: "Прочие паспортные данные"
        description: "JSON без схемы (например, seats, manufacturer)"

  transport_type:
    title: "Пассажирский или грузовой маршрут"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/transport_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  location_type:
    title: "Вид расположения вагона"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/location_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  trip_status_type:
    title: "Статус рейса"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/trip_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  crew_duty_type:
    title: "Должность члена бригады"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/crew_duty_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  coupling_type:
    title: "Отцепка или прицепка"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/coupling_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  act_status_type:
    title: "Статус акта"
    description: |
      Системный справочник.
      Общий для актов отцепки, прицепки и приёма-передачи. Какие статусы допустимы, задаёт проверка в таблице акта:
      у акта отцепки, прицепки - только "проведён" и "отменён".
    constants_from: zhsr-database/src/main/resources/db/dict/act_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  work_type:
    title: "Вид работ"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/work_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  wagon_status_type:
    title: "Состояние вагона"
    constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv
    description: |
      Системный справочник.
      Состояния вагона, например: в простое, в пути, в ремонте. Состояние определяет парк (zhsr-database/src/main/resources/db/dict/park_type.tsv).
    columns:
      text:
        title: "Значение"
      code:
        title: "Код состояния"
        description: "Уникален"

  wagon_type:
    title: "Тип вагона"
    constants_from: db-data/default/04-wagon_type.tsv
    description: |
      Типы вагонов по назначению, например: купейный, плацкартный, ресторан.
    columns:
      text:
        title: "Значение"
      code:
        title: "Код типа"
        description: "Уникален"

  model_type:
    title: "Модель вагона"
    constants_from: db-data/default/05-model_type.tsv
    description: |
      Модели вагонов парка, например: Тулпар-Тальго, Stadler спальный.
    columns:
      text:
        title: "Значение"
      code:
        title: "Код модели"
        description: "Уникален"

  request_status_type:
    title: "Статус заявки на ремонт"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/request_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  severity_type:
    title: "Критичность неисправности"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  service:
    title: "Служба-исполнитель"
    description: |
      Системный справочник.
      Служба, которой адресуется заявка на ремонт. Служба - свойство роли: у роли не больше одной службы, одну службу
      могут иметь несколько ролей (role_type.service).
    constants_from: zhsr-database/src/main/resources/db/dict/service.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  fault_group_type:
    title: "Группа неисправностей"
    description: |
      Группа классификатора DIN, раздел экипировки или клининга.
    columns:
      code:
        title: "Код группы (DIN)"
        description: "Уникален"
      name:
        title: "Название"
      sort_order:
        title: "Порядок показа"

  fault_type:
    title: "Тип неисправности"
    description: |
      Позиция справочника неисправностей. Группа и служба-исполнитель - независимые поля, не связанные между собой.
      Тип с заявками не удаляется, а отключается; тип без заявок можно удалить.
    columns:
      code:
        title: "Код"
        description: "Уникален"
      name:
        title: "Название"
      fault_group_type:
        title: "Группа неисправности"
      severity_type:
        title: "Критичность по умолчанию"
        constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
      service:
        title: "Служба-исполнитель"
        constants_from: zhsr-database/src/main/resources/db/dict/service.tsv
      disabled:
        title: "Отключён"
        description: "Не предлагается при подаче заявки. Тип неисправности с заявками не удаляется, а отключается"

  station:
    title: "Станция"
    description: |
      Вершина графа железных дорог; рёбра - перегоны (stage).
    columns:
      code:
        title: "Код станции"
        description: "Код ЕСР; если в OpenStreetMap его нет - 'OSM' и id точки станции в OpenStreetMap"
      name:
        title: "Название"
      stage_point:
        title: "Точка станции на карте"
        description: "Одна из крайних точек перегонов станции; концы остальных её перегонов совпадают с ней по координатам. Пусто - у станции нет перегонов"

  stage:
    title: "Перегон"
    description: |
      Ребро графа железных дорог между двумя станциями, направление не важно. Ребро хранится один раз:
      from_station - станция с меньшим id.
    columns:
      from_station:
        title: "Станция 1"
      to_station:
        title: "Станция 2"
      km:
        title: "Расстояние, км"

  stage_point:
    title: "Точка линии перегона"
    description: |
      Линия перегона для рисунка пути на карте. Точки идут по порядку seq от from_station к to_station перегона;
      первая точка - координаты from_station, последняя - координаты to_station.
    columns:
      seq:
        title: "Порядковый номер точки"
      x:
        title: "Долгота"
        description: "Градусы, WGS 84"
      y:
        title: "Широта"
        description: "Градусы, WGS 84"

  route:
    title: "Маршрут (поезд)"
    description: |
      Поезд компании, курсирующий по определённому маршруту, например: '655/656'
    columns:
      train_number:
        title: "Номер поезда"
        description: "Уникален в компании"
      name:
        title: "Название (сообщение)"
        description: "Пример: 'Астана-Алматы'"
      duration:
        title: "Время в пути, мин"
      conductor_hours:
        title: "Норма часов за рейс для проводника"
      lnp_hours:
        title: "Норма часов за рейс для начальника поезда"
      pem_hours:
        title: "Норма часов за рейс для ПЭМ"
      dbeg:
        title: "Дата начала действия"
      dend:
        title: "Дата окончания действия"
        description: "Пусто - маршрут действует"
      route_kind:
        title: "Вид маршрута"
        description: "Константы RouteKind в коде: 1 - регулярный, 2 - разовый (поезд без расписания)"
      transport_type:
        title: "Пассажирский или грузовой"
        constants_from: zhsr-database/src/main/resources/db/dict/transport_type.tsv

  route_station:
    title: "Станция маршрута"
    description: |
      Станции маршрута по порядку с нарастающим километражем: остановки и станции следования, которые поезд проходит
      без остановки. Основа натурного листа и расчёта пробега. В оба конца, например: Алматы-Астана-Алматы.
    columns:
      route:
        title: "Маршрут"
      seq:
        title: "Порядковый номер станции на маршруте"
      station:
        title: "Станция"
      km:
        title: "Километраж от начала маршрута"
      have_stop:
        title: "Остановка"
        description: "Нет - станция следования, поезд проходит её без остановки"
      run_duration:
        title: "Время в пути от предыдущей станции маршрута, мин"
        description: "У начальной станции 0"
      stop_duration:
        title: "Стоянка, мин"
        description: "У станций следования, начальной и конечной станций 0"

  db_info:
    title: "Идентификатор БД"
    description: |
      Одна строка: идентификатор серверной БД, новый при каждом пересоздании БД. Локальная БД браузера сверяет его с
      сервером: идентификатор другой - локальные данные стираются.
    columns:
      db_guid:
        title: "Идентификатор БД"
        description: "zhsr-<имя tenant>-<8 случайных hex-символов>"

  dict_version:
    title: "Версия справочника"
    description: |
      Версия справочника для кэша справочников на фронте (DictManager): меняется при каждом изменении справочника.
      Фронт сверяет версии и перечитывает только изменившиеся справочники.
    columns:
      name:
        title: "Имя справочника"
        description: "Как на фронте: WagonState, Depot, Station ..."
      version:
        title: "Версия"
      changed_dt:
        title: "Когда изменён"

  trip:
    title: "Рейс"
    description: |
      Поездка поезда. Станция отправления - первая остановка маршрута, станция прибытия - последняя.
      Начальник поезда и ПЭМ берутся из бригады рейса (trip_crew) - записи с должностями "начальник поезда" и
      "поездной электромеханик".
    columns:
      route:
