        description: "wagon_location, открытая приёмом: депо или парк отстоя акта либо их станция; пусто, пока акт не принят"

  repair_request:
    title: "Заявка на ремонт"
    description: |
      Неисправность вагона, поданная сотрудником. Автор корректирует заявку в течение ограниченного времени после подачи;
      корректировка в журналы не попадает. Статус - в журнале repair_request_status, служба-исполнитель определяется типом неисправности.
    columns:
      number:
        title: "Номер"
        description: "Уникален. Код компании, год (две цифры), порядковый номер в году"
      wagon:
        title: "Вагон"
      trip:
        title: "Рейс"
      fault_type:
        title: "Неисправность"
      severity_type:
        title: "Критичность"
        constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
      description:
        title: "Описание от автора"
      created_by_usr:
        title: "Автор заявки"
      created_dt:
        title: "Время создания"
        description: "Когда пользователь создал заявку, по часам телефона. Часы телефона спешат - проставляется время сервера"
      received_dt:
        title: "Время поступления"
        description: "Когда заявка поступила на сервер. Заявка, созданная без связи, поступает позже создания"

