  check_list_item_norm:
    title: "Норматив пункта чек-листа"
    description: |
      Какое значение пункта - нарушение. Пункт без норматива нарушения не даёт. Для вагона берётся текущий (незакрытый)
      норматив его типа вагона, если его нет - общий (тип вагона пуст); для сотрудника и рейса - общий. Пункт
      показывается, если у пункта нет нормативов или для объекта проверки нашёлся норматив. Норматив, по которому
      проверены значения, при правке закрывается (dend) и заменяется новым. Нормативы пункта для одного типа вагона по
      периодам не пересекаются.
    columns:
      check_list_template_item:
        title: "Пункт шаблона"
      wagon_type:
        title: "Тип вагона"
        description: "Пусто - для всех типов вагона"
        constants_from: db-data/default/04-wagon_type.tsv
      required:
        title: "Обязателен к заполнению"
      num_min:
        title: "Число не меньше"
        description: "Для пункта с числом, включительно. Пусто - без границы"
      num_max:
        title: "Число не больше"
        description: "Для пункта с числом, включительно. Пусто - без границы"
      critical:
        title: "Критичный"
        description: "Нарушение блокирует отправку вагона в рейс"
      fault_type:
        title: "Вид неисправности, которая будет указана в заявке, автоматически создаваемой при нарушении"
        description: "Пусто - нарушение не требует автоматического создания заявки"
      dbeg:
        title: "Начало действия"
      dend:
        title: "Конец действия"
        description: "Пусто - текущая запись"

  check_list_item_norm_value:
    title: "Допустимое значение по нормативу"
    description: |
      Для пункта со значением справочника: допустимые значения; любое другое значение - нарушение. Удаляется вместе
      с нормативом.
    columns:
      check_list_item_norm:
        title: "Норматив"
      check_dict_value:
        title: "Допустимое значение"

  check_list:
    title: "Чек-лист"
    description: |
      Заполненный чек-лист: проверка вагона, рейса или сотрудника. Задано хотя бы одно из трёх.
    columns:
      check_list_template:
        title: "Шаблон чек-листа"
      wagon:
        title: "Вагон"
        description: "Проверяемый вагон"
      trip:
        title: "Рейс"
        description: "Рейс, к которому относится проверка"
      checked_usr:
        title: "Проверяемый сотрудник"
        description: "Медосмотр, инструктаж"
      created_by_usr:
        title: "Кто проводил проверку"
      created_dt:
        title: "Когда начата"
      completed_dt:
        title: "Когда последний раз сохранена"
        description: "Проверяющий нажал «Проверка окончена»: чек-лист приходит на сервер только завершённым. Автор исправляет чек-лист в течение 10 минут после сохранения"

  check_list_value:
    title: "Значение пункта чек-листа"
