      Документы и другие таблицы ссылаются на записи, которые они открыли. Расположение ровно одно из: станция, депо, парк отстоя, рейс.
    columns:
      wagon:
        title: "Вагон"
      dbeg:
        title: "Начало состояния"
      dend:
        title: "Конец состояния"
        description: "Пусто - текущая запись"
      location_type:
        title: "Вид расположения"
        description: "Задаёт, какая из ссылок заполнена: станция, депо, парк отстоя, рейс"
