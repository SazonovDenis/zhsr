        description: "Не предлагается новым пунктам. Справочник с заполненными чек-листами не удаляется, а отключается"

  check_dict_value:
    title: "Вариант ответа"
    description: |
      Ответ из набора: "Да", "Нет" и т. п. Является такой ответ нарушением или нет - решает норматив пункта (check_list_item_norm_value).
    columns:
      check_dict:
        title: "Справочник ответов"
      text_ru:
        title: "Название на русском"
      text_kk:
        title: "Название на казахском"
      text_en:
        title: "Название на английском"
