      text_ru:
        title: "Название на русском"
      text_kk:
        title: "Название на казахском"
      text_en:
        title: "Название на английском"
      value_kind:
        title: "Вид значения"
        description: "Пусто - раздел"
        constants_from: kz.zhsr.app.constants.CheckValueKind
      check_dict:
        title: "Справочник ответов"
        description: "Задан ровно у пункта со значением справочника"
      sort_order:
        title: "Порядок в списке"
      disabled:
        title: "Отключён"
