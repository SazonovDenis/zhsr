        title: "Заявка"
      note:
        title: "Примечание"
      created_by_usr:
        title: "Автор примечания"
      created_dt:
        title: "Время создания"
        description: "Когда пользователь написал примечание, по часам телефона. Часы телефона спешат - проставляется время сервера"
      received_dt:
        title: "Время поступления"
        description: "Когда примечание поступило на сервер. Примечание, созданное без связи, поступает позже создания"

  offline_receipt:
    title: "Квитанция об отправке с телефона"
    description: |
      Защита от повторной отправки: телефон присваивает сообщению guid, и при обрыве связи повторяет его отправку; 
      сервер принимает отправку с таким guid один раз.
    columns:
      client_guid:
        title: "Guid отправки"
        description: "Присвоен телефоном"
      repair_request:
        title: "Заявка"
        description: "Только у отправки новой заявки. При повторе телефон узнаёт по нему id заявки"
      received_dt:
        title: "Время поступления"
        description: "Нужна только чтобы удалять старые квитанции"

  repair_request_status:
    title: "Журнал статусов заявки"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущая запись. Периоды заявки не пересекаются.
      Первая запись вносится при подаче заявки.
    columns:
      repair_request:
        title: "Заявка"
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"
      request_status_type:
        title: "Статус"
        constants_from: zhsr-database/src/main/resources/db/dict/request_status_type.tsv
      created_by_usr:
        title: "Кто внёс запись"
        description: "Подал заявку или сменил статус. Пусто - Система"

  repair_request_executor:
    title: "Движение заявки по исполнителям"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущая запись. Периоды заявки не пересекаются.
      Записей нет, пока исполнителя не назначали.
    columns:
      repair_request:
        title: "Заявка"
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"
      executor_usr:
        title: "Исполнитель"
        description: "Пусто - исполнитель снят"
      created_by_usr:
        title: "Кто внёс запись"
        description: "Назначил или снял исполнителя. Пусто - Система"

  repair_request_info:
    title: "Текущие данные заявки"
    description: |
      Кэш состояния заявки для быстрого доступа. Все поля вычисляемые: копия текущих записей журналов
      repair_request_status и repair_request_executor, обновляется в одной транзакции с журналами; служба - по типу
      неисправности. Одна запись на заявку.
    columns:
      repair_request:
        title: "Заявка"
      dbeg_status:
        title: "Начало текущего статуса"
        description: "Вычисляемое: dbeg текущей записи repair_request_status"
      request_status_type:
        title: "Статус"
        description: "Вычисляемое: из текущей записи repair_request_status"
        constants_from: zhsr-database/src/main/resources/db/dict/request_status_type.tsv
      service:
        title: "Служба-исполнитель"
        description: "Вычисляемое: из типа неисправности, иначе из его категории; запоминается при подаче и при смене типа корректировкой"
        constants_from: zhsr-database/src/main/resources/db/dict/service.tsv
      dbeg_executor:
        title: "Начало текущего исполнителя"
        description: "Вычисляемое: dbeg текущей записи repair_request_executor; пусто - исполнителя не назначали"
      executor_usr:
        title: "Исполнитель"
        description: "Вычисляемое: из текущей записи repair_request_executor; пусто - исполнителя нет"

  wagon_location:
