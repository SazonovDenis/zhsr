      station:
        title: "Расположение: станция"
      depot:
        title: "Расположение: депо"
      yard:
        title: "Расположение: парк отстоя"
      trip:
        title: "Расположение: рейс"

  wagon_status:
    title: "Журнал состояния вагона"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущее состояние. Периоды вагона не пересекаются.
      Документы и другие таблицы ссылаются на записи, которые они открыли.
    columns:
      wagon:
        title: "Вагон"
      dbeg:
        title: "Начало состояния"
      dend:
        title: "Конец состояния"
        description: "Пусто - текущая запись"
      wagon_status_type:
        title: "Состояние"
        constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv

  wagon_info:
    title: "Текущие данные вагона"
    description: |
      Кэш состояния вагона для быстрого доступа. Все поля вычисляемые: копия текущих записей журналов wagon_location и
      wagon_status, обновляется в одной транзакции с журналами. Одна запись на вагон. Расположение ровно одно из:
      станция, депо, парк отстоя, рейс.
    columns:
      wagon:
        title: "Вагон"
      dbeg_location:
        title: "Начало текущего расположения"
        description: "Вычисляемое: dbeg текущей записи wagon_location"
      location_type:
        title: "Вид расположения"
        description: "Вычисляемое: из текущей записи wagon_location"
        constants_from: zhsr-database/src/main/resources/db/dict/location_type.tsv
      station:
        title: "Расположение: станция"
        description: "Вычисляемое: из текущей записи wagon_location"
      depot:
        title: "Расположение: депо"
        description: "Вычисляемое: из текущей записи wagon_location"
      yard:
        title: "Расположение: парк отстоя"
        description: "Вычисляемое: из текущей записи wagon_location"
      trip:
        title: "Расположение: рейс"
        description: "Вычисляемое: из текущей записи wagon_location"
      dbeg_status:
        title: "Начало текущего состояния"
        description: "Вычисляемое: dbeg текущей записи wagon_status"
      wagon_status_type:
        title: "Состояние"
        description: "Вычисляемое: из текущей записи wagon_status"
        constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv
