title: "Документация по базе данных Zholserik"
subtitle: "Проект zhsr"

diagrams:

  trip:
    title: "Поездки и рейсы"
    tables: [ trip, train, train_wagon, wagon_run, route, route_station, station, trip_status_type, usr ]
    hide_fields: [ "trip_status_type", "usr", "station" ]

  train:
    title: "Поезд и вагоны в нём"
    description: "Вагоны, которые ходят вместе из рейса в рейс. Журнал прицепок и отцепок (план и факт) строит участие вагонов: историю составов и ожидаемый состав."
    tables: [ train, train_wagon, train_wagon_change, trip, wagon: { hide_references: [ "depot" ] }, wagon_run, station, route_station, wagon_location: { hide_references: [ "trip", "wagon", "station" ] }, wagon_status: { hide_references: [ "wagon" ] }, wagon_responsible: { hide_references: [ "created_by_usr", "wagon" ] } ]
    hide_fields: [ "station", "route_station", "wagon", "wagon_location", "wagon_status", "wagon_responsible" ]
    top: [ wagon_status, wagon_responsible, wagon_location ]

  trip_crew:
    title: "Бригада рейса"
    tables: [ trip, trip_crew, usr, crew_duty_type, route, train ]
    hide_fields: [ "crew_duty_type", "usr", route, train ]
    top: [ crew_duty_type, usr ]

  wagon_location_status:
    title: "Вагоны: перемещение и смена состояния"
    description: "Главные журналы для любых изменений вагона. Другие таблицы могут хранить дополнительную информацию, но ссылаются сюда."
    tables: [ wagon_location, wagon_status, wagon_responsible: { hide_references: [ "created_by_usr" ] }, wagon_responsible_usr, wagon_edit: { hide_references: [ "wagon", "created_by_usr" ] }, wagon: { hide_references: [ "depot" ] }, depot: { hide_references: [ "station" ] }, yard: { hide_references: [ "station" ] }, station, trip, location_type, usr ]
    hide_fields: [ "depot", "yard", "station" , "wagon", "trip", "location_type", "usr" ]

  geo_location:
    title: "Положение вагонов и сотрудников на местности"
    tables: [ usr_geo_location, wagon_geo_location, usr, wagon: { hide_references: [ "depot" ] } ]
    hide_fields: [ "usr", "wagon" ]

  transfer_act:
    title: "Передача вагонов между депо, станцией и парком отстоя"
    description: "Акт приёма-передачи вагонов между станцией, её депо и парками отстоя"
    tables: [ wagon: { hide_references: [ "depot" ] }, transfer_act, transfer_act_wagon, act_status_type, act_cancellation, station, depot: { hide_references: [ "station" ] }, yard: { hide_references: [ "station" ] }, wagon_location: { hide_references: [ "station", "depot", "wagon", "yard" ] }, wagon_responsible: { hide_references: [ "wagon", "created_by_usr" ] } ]
    hide_fields: [ "wagon", "act_status_type", "station", "depot", "yard", "wagon_location", "wagon_responsible" ]
    top: [ transfer_act_wagon, act_cancellation, act_status_type ]

  repair_request_data:
    title: "Заявки на ремонт: описание"
    tables: [ repair_request, repair_request_photo, repair_request_note, offline_receipt, fault_type, wagon, severity_type, trip ]
    hide_fields: [ "fault_type", "wagon", "severity_type", "trip" ]

  repair_request_executor:
    title: "Заявки на ремонт: состояние и исполнители"
    tables: [ repair_request, repair_request_executor, repair_request_status, repair_request_info, fault_type, request_status_type, usr, service, role_type ]
    hide_fields: [ "request_status_type", "fault_type", "usr" ]
    top: [ usr ]

  info:
    title: "Текущие состояния"
    description: |
      Для каждого объекта (вагон, заявка на ремонт) в таблицах ***_info хранится одна запись, в которую копируются последние данные со всех версионных таблиц объекта. 
      Предназначены для быстрого построения списков.
    tables: [ wagon_info, wagon, wagon_location, wagon_status, wagon_responsible: { hide_references: [ "created_by_usr" ] }, wagon_responsible_usr: { hide_references: [ "usr" ] }, repair_request_info, repair_request: { hide_references: [ "wagon" ] }, repair_request_status, repair_request_executor ]
    hide_fields: [ "wagon", "wagon_location", "wagon_status", "wagon_responsible", "wagon_responsible_usr", "repair_request", "repair_request_status", "repair_request_executor" ]

  system_dict:
    title: "Справочники: системные константы"
    description: "Значения отражены в константах кода (kz.zhsr.app.constants) и меняются только вместе с кодом. Данные - zhsr-database/src/main/resources/db/dict/*.tsv, загружаются при создании БД. В администрировании не редактируются."
    tables: [ role_type, service, category_type, transport_type, location_type, trip_status_type, crew_duty_type, act_status_type, work_type, wagon_status_type, request_status_type, severity_type ]

  fault_type:
    title: "Справочник: типы неисправностей"
    tables: [ fault_type, fault_type_favorite, fault_group_type, severity_type, service, role_type ]
    hide_fields: [ "role_type" ]

  wagon:
    title: "Справочник: вагоны"
    tables: [ wagon, wagon_type, model_type, depot, station, wagon_info: { hide_references: [ station, depot ] } ]
    hide_fields: [ station ]

  route:
    title: "Справочник: маршруты"
    tables: [ route, route_station, depot, station, transport_type ]
    hide_fields: [ "transport_type" ]

  stage:
    title: "Железные дороги: станции и перегоны"
    description: "Граф: станции - вершины, перегоны - рёбра."
    tables: [ station, stage, stage_point, route_station, route ]
    hide_fields: [ "route" ]

  usr:
    title: "Сотрудники: роли, депо, службы и категории"
    tables: [ usr, usr_role, role_type, usr_depot, usr_category, depot: { hide_references: [ "station" ] }, service, category_type ]
    hide_fields: [ role_type, depot, service, category_type ]
    top: [ role_type, depot, service, category_type ]

  check_list_struct:
    title: "Чек-листы: структура"
    description: |
      Шаблон чек-листа - пункты (разделы и пункты со значением) - нормативы пунктов. Какое значение пункта - нарушение,
      решает норматив; по нарушению создаётся заявка с неисправностью норматива.
    tables: [ check_list_template, check_list_template_item, check_dict, check_dict_value, check_list_item_norm, check_list_item_norm_value, wagon_type, fault_type ]
    hide_fields: [ wagon_type, fault_type, check_dict ]
    top: [ check_list_template, check_dict ]

  check_list:
    title: "Чек-листы: проведённые проверки"
    description: |
      Заполненные чек-листы: проверка вагона, рейса или сотрудника (медосмотр, инструктаж). У значения пункта
      сохраняются норматив, признак нарушения и созданная заявка.
    tables: [ check_list, check_list_value, check_list_value_photo, check_list_template, check_list_template_item: { hide_references: [ parent_item ] }, check_dict_value, check_list_item_norm, wagon, trip: { hide_references: [ departed_by_usr, arrived_by_usr ] }, usr, repair_request: { hide_references: [ created_by_usr ] } ]
    hide_fields: [ check_list_template, check_list_template_item, check_dict_value, check_list_item_norm, wagon, trip, usr, repair_request ]
    top: [ check_list_template, check_list_template_item ]

  equip_list_struct:
    title: "Экипировка: структура"
    description: |
      Шаблон описи экипировки - пункты (разделы и позиции имущества) - нормативы пунктов. Требуемое количество
      считается по нормативу с учётом количества мест, купе и окон у модели вагона.
    tables: [ equip_list_template, equip_list_template_item, equip_list_item_norm, wagon_type, model_type, fault_type ]
    hide_fields: [ wagon_type, fault_type ]
    top: [ equip_list_template ]

  equip_list:
    title: "Экипировка: проведённые описи"
    description: |
      Заполненные описи вагона: текущий факт - что лежит в вагоне. У значения пункта сохраняются требуемое количество,
      норматив и признак нарушения; недостача по всей описи - одна заявка.
    tables: [ equip_list, equip_list_value, equip_list_value_photo, equip_list_template, equip_list_template_item: { hide_references: [ parent_item ] }, equip_list_item_norm, wagon, trip: { hide_references: [ departed_by_usr, arrived_by_usr ] }, usr, repair_request: { hide_references: [ created_by_usr ] } ]
    hide_fields: [ equip_list_template, equip_list_template_item, equip_list_item_norm, wagon, trip, usr, repair_request ]
    top: [ equip_list_template, equip_list_template_item ]

tables:

  role_type:
    title: "Роль сотрудника"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/role_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"
      service:
        title: "Служба роли"
        description: "Пусто - роль не относится к службе"
        constants_from: zhsr-database/src/main/resources/db/dict/service.tsv

  usr_role:
    title: "Роли сотрудника"
    description: |
      Роли сотрудника в Системе; права из tz.actors.md проверяются по ним. Роль - один раз на сотрудника.
    columns:
      usr:
        title: "Сотрудник"
      role_type:
        title: "Роль"
        constants_from: zhsr-database/src/main/resources/db/dict/role_type.tsv

  category_type:
    title: "Категория проводника"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/category_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  usr_category:
    title: "Категория проводника у сотрудника"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущая запись. У сотрудника в каждый момент не больше
      одной категории.
    columns:
      usr:
        title: "Сотрудник"
      category_type:
        title: "Категория"
        constants_from: zhsr-database/src/main/resources/db/dict/category_type.tsv
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"

  usr_depot:
    title: "Депо сотрудника"
    description: |
      В каком депо работает сотрудник; у каждого сотрудника есть текущее депо. Запись действует с dbeg по dend
      (не включая); dend пуст - текущая запись. Сотрудник в каждый момент работает не больше чем в одном депо.
    columns:
      usr:
        title: "Сотрудник"
      depot:
        title: "Депо"
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - текущая запись"

  usr:
    title: "Сотрудник"
    description: |
      Пользователь компании.
    columns:
      login:
        title: "Логин"
        description: "Уникален. Как привило ИИН"
      full_name:
        title: "ФИО"
      password_hash:
        title: "Хэш пароля"
      phone:
        title: "Телефон"
        description: "В формате +7XXXXXXXXXX"
      disabled:
        title: "Учётная запись отключена"
        description: "Войти нельзя. Сотрудник не удаляется, а отключается: история остаётся"
      change_password:
        title: "Сменить пароль при входе"
        description: "Пароль задал администратор или пароль по умолчанию. Пока пароль не сменён, сервер разрешает только смену пароля"
      created_dt:
        title: "Когда заведён"

  depot:
    title: "Депо"
    description: |
      Депо приписки вагонов компании.
    columns:
      code:
        title: "Код депо"
        description: "Уникален в компании"
      name_ru:
        title: "Название на русском"
      name_kk:
        title: "Название на казахском"
      name_en:
        title: "Название на английском"
      station:
        title: "Расположение депо"
        description: "Задаёт территориальную привязку"

  yard:
    title: "Парк отстоя"
    description: |
      Место расположения вагонов при станции, как депо.
    columns:
      code:
        title: "Код парка отстоя"
        description: "Уникален в компании"
      name:
        title: "Название"
      station:
        title: "Расположение парка отстоя"
        description: "Задаёт территориальную привязку"

  wagon:
    title: "Вагон"
    description: Каталог вагонов в учете компании.
    columns:
      number:
        title: "Номер вагона"
        description: "Уникален в компании"
      wagon_type:
        title: "Тип вагона"
        constants_from: db-data/default/04-wagon_type.tsv
      model_type:
        title: "Модель"
        constants_from: db-data/default/05-model_type.tsv
      build_year:
        title: "Год постройки"
      maker:
        title: "Завод-изготовитель"
      dbeg:
        title: "Дата ввода в эксплуатацию"
      dend:
        title: "Дата вывода из эксплуатации"
        description: "Пусто - вагон в эксплуатации"
      depot:
        title: "Депо приписки"
      initial_run_km:
        title: "Пробег на момент ввода, км"
        description: "Задаётся при вводе вагона; общий пробег - wagon_info.run_km"
      data:
        title: "Прочие паспортные данные"
        description: "JSON без схемы (например, seats, manufacturer)"

  transport_type:
    title: "Пассажирский или грузовой маршрут"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/transport_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  location_type:
    title: "Вид расположения вагона"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/location_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  trip_status_type:
    title: "Статус рейса"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/trip_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  crew_duty_type:
    title: "Должность члена бригады"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/crew_duty_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  act_status_type:
    title: "Статус акта"
    description: |
      Системный справочник.
      Общий для актов отцепки, прицепки и приёма-передачи. Какие статусы допустимы, задаёт проверка в таблице акта:
      у акта отцепки, прицепки - только "проведён" и "отменён".
    constants_from: zhsr-database/src/main/resources/db/dict/act_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  work_type:
    title: "Вид работ"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/work_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  wagon_status_type:
    title: "Состояние вагона"
    constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv
    description: |
      Системный справочник.
      Состояния вагона, например: в простое, в пути, в ремонте. Состояние определяет парк (zhsr-database/src/main/resources/db/dict/park_type.tsv).
    columns:
      text:
        title: "Значение"
      code:
        title: "Код состояния"
        description: "Уникален"

  wagon_type:
    title: "Тип вагона"
    constants_from: db-data/default/04-wagon_type.tsv
    description: |
      Типы вагонов по назначению, например: купейный, плацкартный, ресторан.
    columns:
      text:
        title: "Значение"
      short_text:
        title: "Кратко"
        description: "Рядом с номером вагона в строке списка: «54956 куп.»"
      code:
        title: "Код типа"
        description: "Уникален"

  model_type:
    title: "Модель вагона"
    constants_from: db-data/default/05-model_type.tsv
    description: |
      Модели вагонов парка, например: Тулпар-Тальго, Stadler спальный.
    columns:
      text:
        title: "Значение"
      code:
        title: "Код модели"
        description: "Уникален"
      seats:
        title: "Количество мест"
        description: "База расчёта норм экипировки"
      compartments:
        title: "Количество купе"
        description: "База расчёта норм экипировки"
      windows:
        title: "Количество окон"
        description: "База расчёта норм экипировки"

  request_status_type:
    title: "Статус заявки на ремонт"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/request_status_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  severity_type:
    title: "Критичность неисправности"
    description: |
      Системный справочник.
    constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  service:
    title: "Служба-исполнитель"
    description: |
      Системный справочник.
      Служба, которой адресуется заявка на ремонт. Служба - свойство роли: у роли не больше одной службы, одну службу
      могут иметь несколько ролей (role_type.service).
    constants_from: zhsr-database/src/main/resources/db/dict/service.tsv
    columns:
      text:
        title: "Значение"
      code:
        title: "Код"
        description: "Уникален"

  fault_group_type:
    title: "Группа неисправностей"
    description: |
      Группа классификатора DIN, раздел экипировки или клининга.
    columns:
      code:
        title: "Код группы (DIN)"
        description: "Уникален"
      name:
        title: "Название"
      sort_order:
        title: "Порядок в списке"

  fault_type:
    title: "Тип неисправности"
    description: |
      Позиция справочника неисправностей. Группа и служба-исполнитель - независимые поля, не связанные между собой.
      Тип с заявками не удаляется, а отключается; тип без заявок можно удалить.
    columns:
      code:
        title: "Код"
        description: "Уникален"
      name:
        title: "Название"
      fault_group_type:
        title: "Группа неисправности"
      severity_type:
        title: "Критичность по умолчанию"
        constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
      service:
        title: "Служба-исполнитель"
        constants_from: zhsr-database/src/main/resources/db/dict/service.tsv
      disabled:
        title: "Отключён"
        description: "Не предлагается при подаче заявки. Тип неисправности с заявками не удаляется, а отключается"

  fault_type_favorite:
    title: "Избранная неисправность"
    description: |
      Неисправность, которая показывается первой при подаче заявки (частые неисправности). Неисправность в избранном -
      один раз; запись удаляется вместе с неисправностью. В администрировании - галочка «В избранном» в форме
      неисправности и таблица «Избранные неисправности» с порядком показа.
    columns:
      fault_type:
        title: "Неисправность"
      sort_order:
        title: "Порядок показа"

  station:
    title: "Станция"
    description: |
      Вершина графа железных дорог; рёбра - перегоны (stage).
    columns:
      code:
        title: "Код станции"
        description: "Код ЕСР; если в OpenStreetMap его нет - 'OSM' и id точки станции в OpenStreetMap"
      name:
        title: "Название"
      stage_point:
        title: "Точка станции на карте"
        description: "Одна из крайних точек перегонов станции; концы остальных её перегонов совпадают с ней по координатам. Пусто - у станции нет перегонов"

  stage:
    title: "Перегон"
    description: |
      Ребро графа железных дорог между двумя станциями, направление не важно. Ребро хранится один раз:
      from_station - станция с меньшим id.
    columns:
      from_station:
        title: "Станция 1"
      to_station:
        title: "Станция 2"
      km:
        title: "Расстояние, км"

  stage_point:
    title: "Точка линии перегона"
    description: |
      Линия перегона для рисунка пути на карте. Точки идут по порядку seq от from_station к to_station перегона;
      первая точка - координаты from_station, последняя - координаты to_station.
    columns:
      seq:
        title: "Порядковый номер точки"
      x:
        title: "Долгота"
        description: "Градусы, WGS 84"
      y:
        title: "Широта"
        description: "Градусы, WGS 84"

  route:
    title: "Маршрут"
    description: |
      Маршрут по расписанию, например: '655/656'
    columns:
      train_number:
        title: "Номер поезда"
        description: "Номер по расписанию, под которым ходит любой поезд маршрута. Уникален в компании"
      name:
        title: "Название (сообщение)"
        description: "Пример: 'Астана-Алматы'"
      conductor_hours:
        title: "Норма часов за рейс для проводника"
      lnp_hours:
        title: "Норма часов за рейс для начальника поезда"
      pem_hours:
        title: "Норма часов за рейс для ПЭМ"
      dbeg:
        title: "Дата начала действия"
      dend:
        title: "Дата окончания действия"
        description: "Пусто - маршрут действует"
      route_kind:
        title: "Вид маршрута"
        constants_from: kz.zhsr.app.constants.RouteKind
      transport_type:
        title: "Пассажирский или грузовой"
        constants_from: zhsr-database/src/main/resources/db/dict/transport_type.tsv

  route_station:
    title: "Станция маршрута"
    description: |
      Станции маршрута по порядку с нарастающим километражем: остановки и станции следования, которые поезд проходит
      без остановки. Основа натурного листа и расчёта пробега. В оба конца, например: Алматы-Астана-Алматы.
    columns:
      route:
        title: "Маршрут"
      seq:
        title: "Порядковый номер станции на маршруте"
      station:
        title: "Станция"
      km:
        title: "Километраж от начала маршрута"
      have_stop:
        title: "Делается ли остановка на станции"
        description: "Нет - станция следования, поезд проходит её без остановки"
      arrival_min:
        title: "Время прибытия, мин от полуночи"
        description: |
          Минуты от полуночи дня отправления с начальной станции; 1440 и больше - следующие сутки. У начальной станции
          пусто
      departure_min:
        title: "Время отправления, мин от полуночи"
        description: |
          Минуты от полуночи дня отправления с начальной станции; 1440 и больше - следующие сутки. У конечной станции
          пусто; у станции следования равно времени прибытия. Стоянка - отправление минус прибытие, время в пути
          маршрута - прибытие на конечную станцию минус отправление с начальной

  db_info:
    title: "Идентификатор БД"
    description: |
      Одна строка: идентификатор серверной БД, новый при каждом пересоздании БД. Локальная БД браузера сверяет его с
      сервером: идентификатор другой - локальные данные стираются.
    columns:
      db_guid:
        title: "Идентификатор БД"
        description: "zhsr-<имя tenant>-<8 случайных hex-символов>"
      demo:
        title: "Демо-БД"
        description: "БД загружена с демо-данными: страница входа показывает быстрый вход демо-пользователями"

  dict_version:
    title: "Версия справочника"
    description: |
      Версия справочника для кэша справочников на фронте (DictManager): меняется при каждом изменении справочника.
      Фронт сверяет версии и перечитывает только изменившиеся справочники.
    columns:
      name:
        title: "Имя справочника"
        description: "Как на фронте: WagonState, Depot, Station ..."
      version:
        title: "Версия"
      changed_dt:
        title: "Когда изменён"

  trip:
    title: "Рейс"
    description: |
      Поездка поезда по маршруту. Станция отправления - первая остановка маршрута, станция прибытия - последняя.
      Вагоны рейса - вагоны поезда на момент. Начальник поезда и ПЭМ берутся из бригады рейса (trip_crew) - записи
      с должностями "начальник поезда" и "поездной электромеханик".
    columns:
      route:
        title: "Маршрут"
      train:
        title: "Поезд"
        description: "Пусто - поезд ещё не назначен"
      planned_dt:
        title: "Плановое отправление"
      trip_status_type:
        title: "Статус"
        constants_from: zhsr-database/src/main/resources/db/dict/trip_status_type.tsv
      departed_dt:
        title: "Дата отправления"
        description: |
          Записи журналов вагонов поезда, открытые отметкой отправления, - текущие записи с dbeg, равным этому времени.
          Исправление и отмена отметки правят именно их
      arrived_dt:
        title: "Дата прибытия"
        description: |
          Записи журналов вагонов поезда, открытые отметкой прибытия, - текущие записи с dbeg, равным этому времени.
          Исправление и отмена отметки правят именно их
      departed_by_usr:
        title: "Кто отметил отправление"
      arrived_by_usr:
        title: "Кто отметил прибытие"
      departure_marked_dt:
        title: "Когда отмечено отправление"
        description: "Время внесения отметки. 10 минут после него отметку можно исправить или отменить"
      arrival_marked_dt:
        title: "Когда отмечено прибытие"
        description: "Время внесения отметки. 10 минут после него отметку можно исправить или отменить"

  train:
    title: "Поезд"
    description: |
      Вагоны, которые ходят вместе из рейса в рейс. Прицепки и отцепки - train_wagon_change, участие вагонов -
      train_wagon; рейс ссылается на поезд.
    columns:
      name:
        title: "Обозначение"
        description: "Уникально среди действующих поездов"
      dbeg:
        title: "Когда сформирован"
      dend:
        title: "Когда расформирован"
        description: "Пусто - поезд действует"

  train_wagon:
    title: "Участие вагона в поезде: история и ожидаемый состав"
    description: |
      Состояние по технике «журнал и состояние» (journal-state-plan-fact.md): поезд и позиция вагона с периодом
      действия. Строится журналом прицепок и отцепок train_wagon_change, напрямую не правится. Два слоя (kind): факт -
      история составов, план - ожидаемый состав: открытые записи факта на время последнего факта поезда и ожидающие
      планы журнала после него; просроченный план - временем последнего факта поезда. Слой план поезда
      перестраивается при каждом изменении журнала поезда. Прицепка на позицию сдвигает вагоны с неё на 1 назад,
      отцепка - вагоны за отцепленным на 1 вперёд; каждый сдвиг закрывает запись вагона и создаёт новую. Вагон в
      каждый момент - не больше чем в одном поезде по факту; позиция поезда в каждый момент - у одного вагона.
      Состав поезда на момент t - записи слоя с dbeg <= t < dend.
    columns:
      train:
        title: "Поезд"
      wagon:
        title: "Вагон"
      kind:
        title: "Слой"
        constants_from: kz.zhsr.app.constants.TrainWagonKind
      seq:
        title: "Позиция в поезде"
        description: "С 1"
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - запись открыта"

  train_wagon_change:
    title: "Прицепка и отцепка вагона: план и факт"
    description: |
      Журнал по технике «журнал и состояние» (journal-state-plan-fact.md): прицепка вагона к поезду или отцепка от
      него в момент времени; по журналу строится участие вагонов в поезде train_wagon. Два слоя (kind): план -
      запланированное событие со статусом, факт - произошедшее. Отметка исполнения плана создаёт факт со ссылкой на
      план и переводит план в «отработан»; время и место факта могут отличаться от плана. Факт вносится временем не
      раньше последнего факта поезда и вагона; удалить ошибочный факт можно только со временем последнего факта
      поезда: участие поезда с этого времени строится заново, отработанный план снова «ожидает». Любая прицепка и
      отцепка задаёт станцию. Факт в рейсе в статусе «выполняется» задаёт рейс и остановку маршрута и открывает записи
      журналов вагона; вне рейса журналы вагона не меняются.
    columns:
      train:
        title: "Поезд"
      wagon:
        title: "Вагон"
      kind:
        title: "Слой"
        constants_from: kz.zhsr.app.constants.TrainWagonKind
      plan_status:
        title: "Статус плана"
        description: "Только у плана"
        constants_from: kz.zhsr.app.constants.TrainWagonPlanStatus
      change_type:
        title: "Вид"
        constants_from: kz.zhsr.app.constants.TrainWagonChangeType
      dt:
        title: "Время"
        description: "У плана - плановое, у факта - фактическое"
      seq:
        title: "Позиция прицепки"
        description: "Позиция, на которую прицепляют вагон, с 1; больше числа вагонов - вагон встаёт последним; у отцепки пусто"
      station:
        title: "Станция"
      trip:
        title: "Рейс"
        description: "Пусто - вне рейса"
      route_station:
        title: "Остановка маршрута рейса"
        description: "Не дублирует station, а даёт определенность в определении маршрута пробега между станциями - порядок станций есть только в станциях рейса."
      plan:
        title: "Отработанный план"
        description: "Только у факта; пусто - факт без плана"
      usr:
        title: "Кто внёс"
        description: "Запланировал или отметил факт"
      comment:
        title: "Основания, примечания"
        description: "Приказ, причина"
      wagon_location:
        title: "Запись расположения, открытая фактом"
        description: "Пусто - факт вне рейса или план"
      wagon_status:
        title: "Запись состояния, открытая фактом"
        description: "Пусто - факт вне рейса или план"
      wagon_responsible:
        title: "Запись ответственных, открытая фактом"
        description: "Факт wagon_responsible; пусто - факт вне рейса, план или сняты все ответственные"
      closed_wagon_responsible:
        title: "Запись ответственных, закрытая фактом"
        description: "Факт wagon_responsible; удаление факта открывает её снова; пусто - ответственных не было"

  wagon_run:
    title: "Пробег вагона за участок рейса"
    description: |
      Участок, который вагон проехал в поезде рейса: от начальной станции маршрута или остановки прицепки до конечной
      станции или остановки отцепки. Строку вносит прибытие рейса или отцепка в пути; отмена прибытия или отцепки
      удаляет строку. Общий пробег вагона (wagon_info.run_km) - пробег на момент ввода плюс сумма km.
    columns:
      wagon:
        title: "Вагон"
      trip:
        title: "Рейс"
      train_wagon_change:
        title: "Участие в поезде"
        description: "Факт прицепки, с которого началось участие вагона в поезде; вагон, отцепленный и снова прицепленный в рейсе, - два участка"
      km:
        title: "Пробег, км"
        description: "Разность километража route_station конца и начала участка"

  usr_geo_location:
    title: "Положение сотрудника на местности"
    description: |
      Очищенные координаты сотрудника по времени.
    columns:
      usr:
        title: "Сотрудник"
      dt:
        title: "Момент"
        description: "Время, в которое вычислено положение"
      x:
        title: "Долгота"
        description: "Градусы, WGS 84"
      y:
        title: "Широта"
        description: "Градусы, WGS 84"

  wagon_geo_location:
    title: "Положение вагона на местности"
    description: |
      Очищенные координаты вагона по времени. Положение вагона вычисляется по положению ответственных за вагон, у вагона
      без ответственных - по составу поезда. Вагон вне рейса новых строк не получает: вагон стоит там, где его последняя
      строка.
    columns:
      wagon:
        title: "Вагон"
      dt:
        title: "Момент"
        description: "Время, в которое вычислено положение"
      x:
        title: "Долгота"
        description: "Градусы, WGS 84"
      y:
        title: "Широта"
        description: "Градусы, WGS 84"

  trip_crew:
    title: "Бригада рейса"
    description: |
      Сотрудник на дежурстве в рейсе с должностью: проводник, начальник поезда, поездной электромеханик (ПЭМ).
      Строка - дежурство сотрудника: один сотрудник - одна строка рейса. Начальник поезда и ПЭМ - не больше одного
      на дежурстве. До отправления строки правятся и удаляются, с отправления - не удаляются. Бригада - роль на
      рейсе; за какие вагоны отвечает сотрудник, хранит журнал ответственных (wagon_responsible): на период рейса
      ответственных выбирают из бригады.
    columns:
      trip:
        title: "Рейс"
      usr:
        title: "Сотрудник"
      crew_duty_type:
        title: "Должность на рейсе"
        constants_from: zhsr-database/src/main/resources/db/dict/crew_duty_type.tsv
      dbeg:
        title: "Заступление на дежурство"
        description: "Отправление рейса; пусто - рейс ещё не отправлен"
      dend:
        title: "Окончание дежурства"
        description: "Прибытие рейса; пусто - на дежурстве"

  act_cancellation:
    title: "Акт отмены"
    description: |
      На акт отмены ссылается отменённый акт приёма-передачи. Отменённый акт не удаляется,
      но больше не действует.
    columns:
      created_by_usr:
        title: "Кто отменил"
      created_dt:
        title: "Когда отменён"
      reason:
        title: "Причина отмены"

  transfer_act:
    title: "Приём-передача вагонов между депо, станцией и парком отстоя"
    description: |
      Акт приёма-передачи вагонов: откуда и куда - разные расположения одной станции (сама станция, её депо и парки
      отстоя); со станции на станцию не передаётся.
      Передающая сторона: со станции - приёмщик, из депо или парка отстоя - мастер депо.
      Принимающая сторона: на станцию - приёмщик, в депо или парк отстоя - мастер депо.
      Откуда - ровно одно из from_station, from_depot, from_yard; куда - ровно одно из to_station, to_depot, to_yard.
      Расположение вагонов меняется только при статусе "проведён" (принят). Акт можно оформить сразу принятым.
      Отменяется весь акт целиком.
    columns:
      number:
        title: "Номер"
        description: "Уникален"
      from_station:
        title: "Откуда: станция"
      from_depot:
        title: "Откуда: депо"
      from_yard:
        title: "Откуда: парк отстоя"
      to_station:
        title: "Куда: станция"
      to_depot:
        title: "Куда: депо"
      to_yard:
        title: "Куда: парк отстоя"
      work_type:
        title: "Вид работ"
        description: "При передаче для ремонта"
        constants_from: zhsr-database/src/main/resources/db/dict/work_type.tsv
      act_status_type:
        title: "Статус"
        constants_from: zhsr-database/src/main/resources/db/dict/act_status_type.tsv
      transferred_by_usr:
        title: "Кто сдал"
      transferred_dt:
        title: "Когда сдан"
      received_by_usr:
        title: "Кто принял или отказал"
        description: "Пусто, пока приём не подтверждён (когда находится в процессе передачи)"
      received_dt:
        title: "Когда принят или отказано"
        description: "Пусто, пока приём не подтверждён (когда находится в процессе передачи)"
      reject_reason:
        title: "Причина отказа в приёме"
        description: "Заполнена при статусе \"отказ\" и у отменённого акта, если до отмены был отказ"
      act_cancellation:
        title: "Акт отмены"
        description: "Заполнен только при статусе \"отменён\""

  transfer_act_wagon:
    title: "Вагон в акте приёма-передачи"
    columns:
      transfer_act:
        title: "Акт приёма-передачи"
      wagon:
        title: "Вагон"
        description: "Уникален в акте"
      seq:
        title: "Порядок"
      with_property:
        title: "С имуществом"
      note:
        title: "Комментарий"
      wagon_location:
        title: "Запись расположения"
        description: "wagon_location, открытая приёмом: депо или парк отстоя акта либо их станция; пусто, пока акт не принят"
      wagon_responsible:
        title: "Запись ответственных, открытая актом"
        description: "Факт wagon_responsible, открытый актом при передаче; при приёме состав ответственных можно сменить в этой записи; пусто у отменённого акта, при отказе и когда акт снял всех ответственных"
      closed_wagon_responsible:
        title: "Запись ответственных, закрытая актом"
        description: "Факт wagon_responsible; отмена акта и отказ открывают её снова; пусто - ответственных не было"

  repair_request:
    title: "Заявка на ремонт"
    description: |
      Неисправность вагона, поданная сотрудником. Автор корректирует заявку в течение ограниченного времени после подачи;
      корректировка в журналы не попадает. Статус - в журнале repair_request_status, служба-исполнитель определяется типом неисправности.
    columns:
      number:
        title: "Номер"
        description: "Уникален. Код компании, год (две цифры), порядковый номер в году"
      wagon:
        title: "В каком вагоне"
      trip:
        title: "На каком рейсе зафиксирована"
        description: "Пусто - неисправность зафиксирована вне рейса, в депо, на станции и т.п."
      fault_type:
        title: "Неисправность"
      severity_type:
        title: "Критичность"
        constants_from: zhsr-database/src/main/resources/db/dict/severity_type.tsv
      description:
        title: "Описание от автора"
      created_by_usr:
        title: "Автор заявки"
      created_dt:
        title: "Время создания"
