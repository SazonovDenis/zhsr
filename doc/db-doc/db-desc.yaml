      usr:
        title: "Ответственный"

  wagon_info:
    title: "Текущие данные вагона"
    description: |
      Кэш состояния вагона для быстрого доступа. Все поля вычисляемые: копия текущих записей журналов wagon_location,
      wagon_status и ссылка на открытую запись факта wagon_responsible, обновляется в одной транзакции с журналами. Одна запись на вагон. Расположение ровно одно из:
      станция, депо, парк отстоя, рейс.
    columns:
      wagon:
        title: "Вагон"
      dbeg_location:
        title: "Начало текущего расположения"
        description: "Вычисляемое: dbeg текущей записи wagon_location"
      location_type:
        title: "Вид расположения"
        description: "Вычисляемое: из текущей записи wagon_location"
        constants_from: zhsr-database/src/main/resources/db/dict/location_type.tsv
      station:
        title: "Расположение: станция"
        description: "Вычисляемое: из текущей записи wagon_location"
      depot:
        title: "Расположение: депо"
        description: "Вычисляемое: из текущей записи wagon_location"
      yard:
        title: "Расположение: парк отстоя"
        description: "Вычисляемое: из текущей записи wagon_location"
      trip:
        title: "Расположение: рейс"
        description: "Вычисляемое: из текущей записи wagon_location"
      dbeg_status:
        title: "Начало текущего состояния"
        description: "Вычисляемое: dbeg текущей записи wagon_status"
      wagon_status_type:
        title: "Состояние"
        description: "Вычисляемое: из текущей записи wagon_status"
        constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv
      wagon_responsible:
        title: "Текущие ответственные"
        description: "Вычисляемое: открытая запись факта wagon_responsible - начало и состав; пусто - ответственных нет"
      run_km:
        title: "Общий пробег, км"
        description: "Вычисляемое: wagon.initial_run_km плюс сумма wagon_run.km"

  check_dict:
    title: "Справочник вариантов ответов"
    description: |
      Готовые наборы ответов для пунктов чек-листа: "Да / Нет", "В порядке / Нарушение" и т. п.
    columns:
