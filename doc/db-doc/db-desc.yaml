      trip:
        title: "Рейс"
      route_station:
        title: "На какой остановке произошла операция"
      order_info:
        title: "Приказ-основание"
      reason:
        title: "Причина"
      created_by_usr:
        title: "Кто составил"
      created_dt:
        title: "Когда"
      act_dt:
        title: "Время акта"
        description: "Время, которое указал пользователь: с него действуют записи журналов вагонов"
      act_status_type:
        title: "Статус"
        description: "Проведён или отменён"
        constants_from: zhsr-database/src/main/resources/db/dict/act_status_type.tsv
