      created_by_usr:
        title: "Автор фото"
      created_dt:
        title: "Время создания"
        description: "Когда пользователь сделал фото, по часам телефона. Часы телефона спешат - проставляется время сервера"
      received_dt:
        title: "Время поступления"
        description: "Когда фото поступила на сервер. Фото, сделанное без связи, поступает позже создания"

  repair_request_note:
    title: "Примечание (комментарий) к заявке"
