    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущее расположение. Периоды вагона не пересекаются.
      Документы и другие таблицы ссылаются на записи, которые они открыли. Расположение ровно одно из: станция, депо, парк отстоя, рейс.
    columns:
      wagon:
        title: "Вагон"
      dbeg:
        title: "Начало состояния"
      dend:
        title: "Конец состояния"
        description: "Пусто - текущая запись"
      location_type:
        title: "Вид расположения"
        description: "Задаёт, какая из ссылок заполнена: станция, депо, парк отстоя, рейс"
        constants_from: zhsr-database/src/main/resources/db/dict/location_type.tsv
      station:
        title: "Расположение: станция"
      depot:
        title: "Расположение: депо"
      yard:
        title: "Расположение: парк отстоя"
      trip:
        title: "Расположение: рейс"

  wagon_status:
    title: "Журнал состояния вагона"
    description: |
      Запись действует с dbeg по dend (не включая); dend пуст - текущее состояние. Периоды вагона не пересекаются.
      Документы и другие таблицы ссылаются на записи, которые они открыли.
    columns:
      wagon:
        title: "Вагон"
      dbeg:
        title: "Начало состояния"
      dend:
        title: "Конец состояния"
        description: "Пусто - текущая запись"
      wagon_status_type:
        title: "Состояние"
        constants_from: zhsr-database/src/main/resources/db/dict/wagon_status_type.tsv

  wagon_edit:
    title: "Ручная правка вагона"
    description: |
      Смена состояния (Ф-ВАГ-02) или расположения (Ф-ВАГ-03) администратором с комментарием, смена ответственных
      (Ф-ВАГ-07) - без акта. Ссылается на записи журналов, которые открыла: при смене состояния - wagon_status, при
      смене расположения - wagon_location и запись ответственных, при смене ответственных - только запись
      ответственных. Запись ответственных, которую правка закрыла, - closed_wagon_responsible.
    columns:
      wagon:
        title: "Вагон"
      created_by_usr:
        title: "Кто правил"
      created_dt:
        title: "Когда"
      comment:
        title: "Комментарий"
        description: "Обязателен при смене состояния и расположения; при смене ответственных - пусто"
      wagon_location:
        title: "Запись расположения"
        description: "wagon_location, открытая сменой расположения"
      wagon_status:
        title: "Запись состояния"
        description: "wagon_status, открытая сменой состояния"
      wagon_responsible:
        title: "Запись ответственных, открытая правкой"
        description: "Факт wagon_responsible, открытый сменой расположения или ответственных; пусто - правка сняла всех ответственных"
      closed_wagon_responsible:
        title: "Запись ответственных, закрытая правкой"
        description: "Факт wagon_responsible; отмена правки открывает её снова; пусто - ответственных не было"

  wagon_responsible:
    title: "Журнал ответственных за вагон: план и факт"
    description: |
      Два слоя в одной таблице: план и факт (kind). Запись - период с dbeg по dend (не включая), состав ответственных
      периода - wagon_responsible_usr. dend пуст - период открыт: у факта - текущие ответственные. Периоды факта вагона
      не пересекаются; план и факт между собой не сверяются. Отсутствие открытой записи факта - ответственных нет.
      План есть только у рейса и связан с ним ссылкой и стадией (trip, trip_point): план ответственных на рейс -
      стадия "отправление" (его строит распределение ответственных из бригады рейса, отрабатывает отметка
      отправления), план ответственных после рейса - "прибытие" (отрабатывает отметка прибытия); у вагона один
      ожидающий план на стадию рейса. dbeg плана - справочно: время стадии по плану рейса, при правке рейса
      переносится; dend плана пуст. Отметка создаёт запись факта с рейсом и стадией и переводит план в статус
      "отработан"; отмена отметки находит её факты по рейсу и стадии. План правится, пока его не отработали и не
      отменили; факт пишется временем не позже текущего. Документы и другие таблицы ссылаются на записи факта, которые
      они открыли и закрыли.
    columns:
      wagon:
        title: "Вагон"
      kind:
        title: "Слой"
        constants_from: kz.zhsr.app.constants.WagonResponsibleKind
      plan_status:
        title: "Статус плана"
        description: "Только у плана"
        constants_from: kz.zhsr.app.constants.WagonResponsiblePlanStatus
      trip:
        title: "Рейс"
        description: "План - рейс плана (обязательно); факт - рейс, в котором сменили ответственных; пусто - не рейс"
      trip_point:
        title: "Стадия рейса"
        description: "План - какую отметку ждёт (обязательно); факт - какая отметка его записала; пусто - не отметка"
        constants_from: kz.zhsr.app.constants.WagonResponsibleTripPoint
      dbeg:
        title: "Начало периода"
      dend:
        title: "Конец периода"
        description: "Пусто - период открыт"
      created_by_usr:
        title: "Кто внёс"
        description: "Запланировал или отметил факт"
      created_dt:
        title: "Когда внесли"
      comment:
        title: "Основания, примечания"

  wagon_responsible_usr:
    title: "Ответственный в периоде журнала"
    description: "Состав ответственных периода wagon_responsible: строка - один ответственный; сотрудник в периоде один раз."
    columns:
      wagon_responsible:
