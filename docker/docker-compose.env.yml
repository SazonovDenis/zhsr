# Окружение разработки zhsr: сервисы, нужные приложению (db - PostgreSQL, s3 - хранилище файлов). Запуск - скрипт env-start в корне проекта.
# Переменные - из .env в корне проекта (env-start передаёт его через --env-file).
# memswap_limit = mem_limit -- отключаем своп, чтобы раздувшийся сервис упал сам по OOM, а не утянул за собой весь хост.
# имя проекта задано явно: по умолчанию им стала бы папка docker, как и у других проектов с такой же раскладкой
name: zhsr

services:
  db:
    build: zhsr-postgres
    image: zhsr-postgres
    container_name: zhsr-db
    restart: ${RESTART_POLICY:-no}
    mem_limit: 1536m
    memswap_limit: 1536m
    # суперпользователь PostgreSQL - тот же, под которым install/db-reset создаёт БД и пользователя приложения
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - zhsr_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${DB_ADMIN_USER} -d postgres
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "${DB_PORT}:5432"
    networks:
      - zhsr_network

  # S3-хранилище файлов (фото заявок): MinIO-совместимый сервер, как в kis-smart-catalog. Порт S3 - S3_PORT, консоль -
  # S3_CONSOLE_PORT. Бакет S3_BUCKET создаёт install/storage-reset.
  s3:
    image: pgsty/silo:latest
    container_name: zhsr-s3
    restart: ${RESTART_POLICY:-no}
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_DOMAIN: ""
      # GOMEMLIMIT - порог сборки мусора Go, MINIO_API_REQUESTS_MAX - предел одновременных S3-запросов
      GOMEMLIMIT: "384MiB"
      MINIO_API_REQUESTS_MAX: "32"
    command: server /data --console-address ":9001" --compat
    volumes:
      - zhsr_s3_data:/data
    ports:
      - "${S3_PORT}:9000"
      - "${S3_CONSOLE_PORT}:9001"
    networks:
      - zhsr_network

volumes:
  zhsr_db_data:
    name: zhsr_db_data
  zhsr_s3_data:
    name: zhsr_s3_data

networks:
  zhsr_network:
    name: zhsr_network
    driver: bridge
