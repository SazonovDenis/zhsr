dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
}

// справочники doc/dict/*.tsv - в classpath db/dict, данные db-data/*.tsv - в db/data; загружает Liquibase
processResources {
    from("$rootDir/doc/dict") {
        into 'db/dict'
    }
    from("$rootDir/db-data") {
        into 'db/data'
    }
}
