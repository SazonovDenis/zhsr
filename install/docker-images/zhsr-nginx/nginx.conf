# nginx для zhsr: статика zhsr-web + прокси /api (и WebSocket /api/ws) на zhsr-app
worker_processes auto;
pid /run/nginx.pid;

events {
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # Не меньше лимита запроса с фото на сервере (spring.servlet.multipart.max-request-size=110MB)
    client_max_body_size 120m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;

    # WebSocket: заголовок Connection - по запросу клиента
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # zhsr-app - сервис в той же сети docker compose
    upstream zhsr_app {
        server zhsr-app:8080;
    }

    # http - только проверка Let's Encrypt, остальное - на https: PWA (сервис-воркер, камера) работает только по https
    server {
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/acme/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        include /etc/nginx/zhsr.locations.conf;
    }
}
