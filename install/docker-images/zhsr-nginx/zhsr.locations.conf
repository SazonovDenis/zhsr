# Статика zhsr-web - внутри образа; маршруты фронта (history mode) - на index.html
location / {
    root /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
}

# Сервис-воркер, манифест и index.html не кэшируются: иначе телефон не увидит новую версию
location ~ ^/(sw\.js|manifest\.json|index\.html)$ {
    root /usr/share/nginx/html/;
    add_header Cache-Control "no-cache";
}

# API: /api/... -> zhsr-app без префикса /api (у контроллеров его нет)
location /api/ {
    proxy_pass http://zhsr_app/;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket /api/ws -> zhsr-app /ws: соединение держится долго
location = /api/ws {
    proxy_pass http://zhsr_app/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
