<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жолсерік · 5. Контроль</title>
<link rel="stylesheet" href="common.css">
</head>
<body class="viz-root">
<div class="wrap">
  <header class="top">
    <div class="ttl">
      <div class="kicker">Дашборд 5 · ракурс «контроль»</div>
      <h1>Контроль: работают ли чек-листы и описи</h1>
      <p>Диаграммы сверяют то, что отмечают проверяющие в чек-листах и описях, с тем, что потом происходит в рейсе:
        с заявками пассажирских вагонов, недостачами и температурой. Проверка ценна, только если она что-то предсказывает.</p>
    </div>
    <nav class="dash"></nav>
  </header>
  <div class="filters">
    <label class="theme">Оформление
      <select id="fTheme"><option value="">Как в системе</option><option value="light">Светлое</option><option value="dark">Тёмное</option></select>
    </label>
  </div>
  <div class="stack" id="grid"></div>
</div>
<script src="geo.js"></script>
<script src="common.js"></script>
<script src="data.js"></script>
<script>
'use strict';
setupPage('d5.html');
const YEAR0 = TODAY - 364 * DAY;
const tripsDone = D.TRIPS.filter(t => t.wagons.length && t.arr <= NOW && t.dep >= YEAR0);
const manualInTrip = D.REQS.filter(q => q.trip && q.src === 'manual' && q.created >= YEAR0);

/* ---------- 5.1. Утечка имущества ---------- */
function c51(el) {
  const items = D.EQUIP_ITEMS.map((it, k) => ({ it, k }));
  const routes = D.ROUTES.map(r => ({ r, eq: D.EQUIPS.filter(e => e.route === r.id && e.t >= YEAR0) })).filter(x => x.eq.length);
  const rate = (k, x) => x.eq.filter(e => e.short & (1 << k)).length / x.eq.length;
  const all = D.EQUIPS.filter(e => e.t >= YEAR0);
  const rowAvg = k => all.filter(e => e.short & (1 << k)).length / all.length;
  items.sort((a, b) => rowAvg(b.k) - rowAvg(a.k));
  const colAvg = x => mean(items.map(i => rate(i.k, x)));
  routes.sort((a, b) => colAvg(b) - colAvg(a));
  const W = 900, L = 190, T = 90, cw = 54, ch = 26;
  const vals = items.flatMap(i => routes.map(x => rate(i.k, x)));
  const qs = [1, 2, 3, 4, 5, 6].map(q => quantile(vals, q / 7));
  const col = v => v <= 0 ? 'var(--surface-2)' : ORANGE[qs.filter(q => v > q).length];
  let s = '';
  const cmax = Math.max(...routes.map(colAvg));
  routes.forEach((x, j) => {
    const X = L + j * cw;
    s += `<text transform="translate(${X + cw / 2},${T - 30}) rotate(-35)" font-size="11" class="strong">${esc(x.r.num)}</text>`;
    const h = colAvg(x) / cmax * 22;
    s += `<rect x="${X + 6}" y="${P(T - 6 - h)}" width="${cw - 14}" height="${P(h)}" rx="2" fill="var(--neutral-band)"${tipAttr(`<b>${esc(x.r.num)} ${esc(x.r.name)}</b><br>Описей: ${fmt(x.eq.length)}<br>Средняя доля недостач по позиции: ${pct(colAvg(x), 1)}`)}/>`;
  });
  const hot = [];
  items.forEach((i, r) => {
    const Y = T + r * ch, avg = rowAvg(i.k);
    s += `<text x="${L - 10}" y="${Y + 17}" text-anchor="end" font-size="11">${esc(i.it.name)}</text>`;
    routes.forEach((x, j) => {
      const v = rate(i.k, x), isHot = v > avg * 2 && v > 0.03;
      if (isHot) hot.push({ i, x, v, avg });
      s += `<rect x="${L + j * cw}" y="${Y}" width="${cw - 3}" height="${ch - 3}" rx="3" fill="${col(v)}"${isHot ? ' stroke="var(--text-primary)" stroke-width="2"' : ''}` +
        tipAttr(`<b>${esc(i.it.name)}</b><br>${esc(x.r.num)} ${esc(x.r.name)}<br>Описей с недостачей: ${pct(v, 1)}<br>По всем маршрутам: ${pct(avg, 1)}`) + '/>';
      if (isHot) s += `<text x="${L + j * cw + (cw - 3) / 2}" y="${Y + 16}" text-anchor="middle" font-size="10" class="strong halo">${pct(v)}</text>`;
    });
    const bw = avg / Math.max(...items.map(z => rowAvg(z.k))) * 80;
    s += `<rect x="${L + routes.length * cw + 12}" y="${Y + 5}" width="${P(bw)}" height="${ch - 13}" rx="2" fill="var(--neutral-band)"/>` +
      `<text x="${L + routes.length * cw + 18 + bw}" y="${Y + 16}" font-size="10" class="muted">${pct(avg, 1)}</text>`;
  });
  const H = T + items.length * ch + 10;
  el.innerHTML = legend([{ ramp: ORANGE, from: 'редко', to: 'часто' }, { name: 'обводка - вдвое чаще, чем по всем маршрутам', color: 'transparent; border:0.15rem solid var(--text-primary)' }]) +
    `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  hot.sort((a, b) => b.v / b.avg - a.v / a.avg);
  return {
    find: `Недостача - не свойство позиции, а свойство пары «позиция × маршрут»: ${hot.slice(0, 3).map(h => `${esc(h.i.it.name.toLowerCase())} на ${esc(h.x.r.num)} - ${pct(h.v)} описей при ${pct(h.avg, 1)} в среднем`).join('; ')}. ` +
      'Пары указывают, где искать причину: в посадке, в пассажирах маршрута или в бригаде.',
    table: table(['Позиция'].concat(routes.map(x => x.r.num)), items.map(i => [esc(i.it.name)].concat(routes.map(x => pct(rate(i.k, x), 1)))), routes.map((_, j) => j + 1))
  };
}

/* ---------- 5.2. Температура в вагоне ---------- */
const st52 = { model: 'all' };
function c52(el) {
  el.innerHTML = '';
  const months = []; for (let m = 11; m >= 0; m--) { const d = new Date(TODAY); months.push(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - m, 1)); }
  const mi = t => { for (let i = 11; i >= 0; i--) if (t >= months[i]) return i; return -1; };
  const fit = c => st52.model === 'all' || (st52.model === 'talgo' ? c.model === 1 : st52.model === 'old' ? c.model === 0 : c.model >= 3);
  const chk = D.CHECKS.filter(c => c.t >= months[0] && fit(c));
  const W = 900, L = 60, Rr = 20, T = 14, Hs = 300, gapY = 40, Hb = 110;
  const cw = (W - L - Rr) / 12, y = lin(13, 30, T + Hs, T);
  let s = yGrid(L, W - Rr, y, [14, 16, 18, 20, 22, 24, 26, 28, 30], v => v + '°');
  s += `<rect x="${L}" y="${P(y(24))}" width="${W - Rr - L}" height="${P(y(20) - y(24))}" fill="var(--s3)" opacity="0.10"/>` +
    `<text x="${W - Rr - 4}" y="${P(y(24)) + 12}" text-anchor="end" font-size="10" class="muted">норма 20-24 °C</text>`;
  const R = makeRnd(7);
  const viol = new Array(12).fill(0), n = new Array(12).fill(0);
  chk.forEach((c, k) => {
    const i = mi(c.t); if (i < 0) return;
    n[i]++; const bad = c.temp < 20 || c.temp > 24; if (bad) viol[i]++;
    if (!bad && k % 6) return;
    const X = L + i * cw + cw / 2 + R.normal(0, cw / 7);
    s += `<circle cx="${P(X)}" cy="${P(y(clamp(c.temp, 13, 30)))}" r="${bad ? 2.4 : 1.6}" fill="${bad ? 'var(--critical)' : 'var(--neutral)'}" opacity="${bad ? 0.8 : 0.35}"/>`;
  });
  months.forEach((m, i) => {
    s += `<rect class="hit" x="${P(L + i * cw)}" y="${T}" width="${P(cw)}" height="${Hs}"${tipAttr(`<b>${MONTHS_FULL[monthOf(m)]}</b><br>Чек-листов: ${fmt(n[i])}<br>Температура вне нормы: ${pct(viol[i] / (n[i] || 1), 1)}`)}/>` +
      `<text x="${P(L + i * cw + cw / 2)}" y="${T + 12}" text-anchor="middle" font-size="10" class="strong">${pct(viol[i] / (n[i] || 1))}</text>`;
  });
  // Ниже - заявки на отопление и кондиционер, поданные в рейсе
  const yb0 = T + Hs + gapY;
  const heat = new Array(12).fill(0), cool = new Array(12).fill(0);
  const isHeat = f => ['Не греет отопление', 'Холодно в вагоне'].includes(f.name), isCool = f => ['Не работает кондиционер', 'Кондиционер не охлаждает'].includes(f.name);
  for (const q of manualInTrip) {
    const i = mi(q.created); if (i < 0) continue;
    const w = D.WBY[q.wagon]; if (!fit({ model: w.model })) continue;
    if (isHeat(q.fault)) heat[i]++; else if (isCool(q.fault)) cool[i]++;
  }
  const wt = new Array(12).fill(0);
  for (const t of tripsDone) { const i = mi(t.dep); if (i >= 0) wt[i] += t.wagons.filter(id => fit({ model: D.WBY[id].model })).length; }
  const hr = heat.map((v, i) => v / (wt[i] || 1) * 100), cr = cool.map((v, i) => v / (wt[i] || 1) * 100);
  const bmax = niceMax(Math.max(...hr.map((v, i) => v + cr[i])), 3), yb = lin(0, bmax, yb0 + Hb, yb0);
  s += yGrid(L, W - Rr, yb, niceTicks(0, bmax, 3), v => fmt(v, 1));
  s += `<text x="${L}" y="${yb0 - 8}" font-size="11" class="muted">заявки на отопление и кондиционер в пути, на 100 вагоно-рейсов</text>`;
  months.forEach((m, i) => {
    const X = L + i * cw + 8, bw = cw - 16;
    s += `<rect x="${P(X)}" y="${P(yb(hr[i]))}" width="${P(bw)}" height="${P(yb(0) - yb(hr[i]))}" fill="var(--s1)"${tipAttr(`${MONTHS_FULL[monthOf(m)]}: отопление ${fmt(hr[i], 2)} на 100 вагоно-рейсов`)}/>` +
      `<rect x="${P(X)}" y="${P(yb(hr[i] + cr[i]))}" width="${P(bw)}" height="${P(yb(hr[i]) - yb(hr[i] + cr[i]))}" fill="var(--s2)"${tipAttr(`${MONTHS_FULL[monthOf(m)]}: кондиционер ${fmt(cr[i], 2)} на 100 вагоно-рейсов`)}/>` +
      `<text x="${P(L + i * cw + cw / 2)}" y="${yb0 + Hb + 15}" text-anchor="middle" font-size="11" class="muted">${MONTHS[monthOf(m)]}</text>`;
  });
  el.insertAdjacentHTML('beforeend', legend([{ name: 'замер в норме (каждый шестой)', color: 'var(--neutral)', kind: 'dot' }, { name: 'замер вне нормы', color: 'var(--critical)', kind: 'dot' },
    { name: 'заявки: отопление', color: 'var(--s1)' }, { name: 'заявки: кондиционер', color: 'var(--s2)' }]) + `<svg viewBox="0 0 ${W} ${yb0 + Hb + 22}">${s}</svg>`);
  toggles(el, [{ v: 'all', name: 'Все модели' }, { v: 'talgo', name: 'Тулпар-Тальго' }, { v: 'old', name: 'Без модели' }, { v: 'stadler', name: 'Stadler' }], st52.model, v => { st52.model = v; cards[1].redraw(); });
  const vr = (pred, mon) => { const a = D.CHECKS.filter(c => c.t >= months[0] && pred(c) && mon.includes(monthOf(c.t))); return a.filter(c => c.temp < 20 || c.temp > 24).length / (a.length || 1); };
  return {
    find: `Зимой температура вне нормы у вагонов без модели в ${pct(vr(c => c.model === 0, [11, 0, 1]), 1)} замеров, у «Тальго» - в ${pct(vr(c => c.model === 1, [11, 0, 1]), 1)}; летом - ${pct(vr(c => c.model === 0, [5, 6, 7]), 1)} против ${pct(vr(c => c.model === 1, [5, 6, 7]), 1)}: старые вагоны хуже держат температуру в оба сезона. ` +
      'Доля нарушений по замерам и заявки в пути растут в одни и те же месяцы: замер при приёмке предупреждает о заявках раньше, чем пассажиры начнут жаловаться.',
    table: table(['Месяц', 'Чек-листов', 'Вне нормы', 'Отопление на 100 вагоно-рейсов', 'Кондиционер на 100 вагоно-рейсов'],
      months.map((m, i) => [MONTHS_FULL[monthOf(m)], fmt(n[i]), pct(viol[i] / (n[i] || 1), 1), fmt(hr[i], 2), fmt(cr[i], 2)]), [1, 2, 3, 4])
  };
}

/* ---------- 5.3. Чек-лист до рейса и заявки в рейсе ---------- */
function c53(el) {
  const checked = new Set(D.CHECKS.map(c => c.trip + ':' + c.wagon));
  const reqN = new Map(); for (const q of manualInTrip) { const k = q.trip + ':' + q.wagon; reqN.set(k, (reqN.get(k) || 0) + 1); }
  const rows = D.ROUTES.map(r => {
    const a = { y: [0, 0], n: [0, 0] };
    for (const t of tripsDone) if (t.route === r.id) for (const w of t.wagons) { const k = t.id + ':' + w, c = checked.has(k) ? 0 : 1; a.n[c]++; a.y[c] += reqN.get(k) || 0; }
    return { r, with: a.y[0] / (a.n[0] || 1) * 10, without: a.y[1] / (a.n[1] || 1) * 10, nw: a.n[0], nn: a.n[1] };
  }).filter(x => x.nw > 50 && x.nn > 50).sort((a, b) => b.r.durMin - a.r.durMin);
  const W = 900, L = 260, Rr = 120, T = 30, rh = 34;
  const xmax = niceMax(Math.max(...rows.map(x => Math.max(x.with, x.without))) * 1.05), x = lin(0, xmax, L, W - Rr);
  const H = T + rows.length * rh + 30;
  let s = xTicks(H - 26, x, niceTicks(0, xmax, 6), v => fmt(v, 1), T - 10);
  s += `<text x="${(L + W - Rr) / 2}" y="${H}" text-anchor="middle" font-size="11" class="muted">заявок в пути на 10 вагоно-рейсов →</text>`;
  rows.forEach((d, i) => {
    const Y = T + i * rh + rh / 2, gain = 1 - d.with / d.without;
    s += `<text x="${L - 12}" y="${Y}" text-anchor="end" font-size="11" class="strong">${esc(d.r.num)} ${esc(d.r.name)}</text>` +
      `<text x="${L - 12}" y="${Y + 13}" text-anchor="end" font-size="10" class="muted">${fmt(d.r.durMin / 60, 0)} ч в пути</text>` +
      `<line x1="${P(x(d.with))}" x2="${P(x(d.without))}" y1="${Y}" y2="${Y}" stroke="var(--axis)" stroke-width="3" stroke-linecap="round"/>` +
      `<circle cx="${P(x(d.without))}" cy="${Y}" r="6" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="2"${tipAttr(`<b>${esc(d.r.num)}</b>, без чек-листа приёмки<br>Вагоно-рейсов: ${fmt(d.nn)}<br>Заявок на 10: ${fmt(d.without, 2)}`)}/>` +
      `<circle cx="${P(x(d.with))}" cy="${Y}" r="6" fill="var(--s1)" stroke="var(--surface-1)" stroke-width="2"${tipAttr(`<b>${esc(d.r.num)}</b>, с чек-листом приёмки<br>Вагоно-рейсов: ${fmt(d.nw)}<br>Заявок на 10: ${fmt(d.with, 2)}`)}/>` +
      `<text x="${W - Rr + 10}" y="${Y + 4}" font-size="11" class="${gain > 0.15 ? 'strong' : 'muted'}">${gain > 0 ? '−' : '+'}${pct(Math.abs(gain))}</text>`;
  });
  el.innerHTML = legend([{ name: 'вагон принят по чек-листу перед рейсом', color: 'var(--s1)', kind: 'dot' }, { name: 'без чек-листа', color: 'var(--s2)', kind: 'dot' }]) + `<svg viewBox="0 0 ${W} ${H + 6}">${s}</svg>`;
  const long = rows.filter(d => d.r.durMin > 12 * 60), short = rows.filter(d => d.r.durMin <= 12 * 60);
  const g = a => mean(a.map(d => 1 - d.with / d.without));
  return {
    find: `На маршрутах дольше 12 часов вагон, принятый по чек-листу, даёт в пути на ${pct(g(long))} меньше заявок; на коротких маршрутах - на ${pct(g(short))}. ` +
      'Проверка окупается там, где неисправность успевает «созреть» за рейс; на коротких маршрутах чек-лист можно упростить.',
    side: '<div><h3>Оговорка</h3><p>Чек-лист чаще заполняют внимательные ЛНП; часть разницы - их заслуга, а не самой проверки. Сравнение по одному ЛНП (с проверкой и без) снимет эту оговорку.</p></div>',
    table: table(['Маршрут', 'Часов в пути', 'Вагоно-рейсов с чек-листом', 'без', 'Заявок на 10 с чек-листом', 'без'],
      rows.map(d => [esc(d.r.num + ' ' + d.r.name), fmt(d.r.durMin / 60, 0), fmt(d.nw), fmt(d.nn), fmt(d.with, 2), fmt(d.without, 2)]), [1, 2, 3, 4, 5])
  };
}

/* ---------- 5.4. Пункты чек-листа, которые отмечают формально ---------- */
function c54(el) {
  const chk = D.CHECKS.filter(c => c.t >= YEAR0);
  const wt = sum(tripsDone.map(t => t.wagons.length));
  // Пункт без неисправности в нормативе заявок не создаёт и в сравнение не входит
  const pts = D.CHECK_ITEMS.map((it, k) => ({ it, k })).filter(x => x.it.fault).map(({ it, k }) => {
    const v = chk.filter(c => c.viol & (1 << k)).length / chk.length;
    const comp = manualInTrip.filter(q => q.fault.name === it.fault).length / wt * 100;
    return { it, v: v * 100, comp };
  });
  const W = 900, H = 440, L = 70, Rr = 40, T = 20, B = 44;
  const xmax = niceMax(Math.max(...pts.map(p => p.v)) * 1.15), ymax = niceMax(Math.max(...pts.map(p => p.comp)) * 1.15);
  const x = lin(0, xmax, L, W - Rr), y = lin(0, ymax, H - B, T);
  let s = yGrid(L, W - Rr, y, niceTicks(0, ymax, 5), v => fmt(v, 1)) + xTicks(H - B, x, niceTicks(0, xmax, 6), v => fmt(v, 1) + '%');
  const k = median(pts.map(p => p.comp / (p.v || 1e-9)));
  const x2 = Math.min(xmax, ymax / k);
  s += `<line x1="${P(x(0))}" y1="${P(y(0))}" x2="${P(x(x2))}" y2="${P(y(x2 * k))}" stroke="var(--axis)" stroke-width="1.5"/>` +
    `<text x="${P(x(x2) - 6)}" y="${P(y(x2 * k)) + 14}" text-anchor="end" font-size="10" class="muted">обычное соотношение</text>`;
  s += `<text x="${L + 8}" y="${T + 12}" font-size="11" class="muted">пассажиры жалуются, а чек-лист «в порядке»</text>` +
    `<text x="${W - Rr - 8}" y="${H - B - 8}" text-anchor="end" font-size="11" class="muted">чек-лист строже, чем нужно</text>`;
  s += `<text x="${(L + W - Rr) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" class="muted">доля чек-листов приёмки, где пункт отмечен нарушением →</text>`;
  s += `<text x="${L}" y="${T - 6}" font-size="11" class="muted">заявки в пути по неисправности пункта на 100 вагоно-рейсов ↑</text>`;
  const out = pts.map(p => ({ p, ratio: p.comp / (p.v * k || 1e-9) })).sort((a, b) => b.ratio - a.ratio);
  for (const { p, ratio } of out) {
    const bad = ratio > 2.2;
    s += `<circle cx="${P(x(p.v))}" cy="${P(y(p.comp))}" r="7" fill="${bad ? 'var(--critical)' : 'var(--s1)'}" stroke="var(--surface-1)" stroke-width="2"` +
      tipAttr(`<b>${esc(p.it.name)}</b><br>Нарушение в чек-листах: ${fmt(p.v, 2)}%<br>Заявок в пути на 100 вагоно-рейсов: ${fmt(p.comp, 2)}<br>Неисправность норматива: ${esc(p.it.fault)}`) + '/>' +
      `<text x="${P(x(p.v) + 11)}" y="${P(y(p.comp) + 4)}" font-size="11" class="${bad ? 'strong' : ''} halo">${esc(p.it.name)}</text>`;
  }
  el.innerHTML = legend([{ name: 'пункт чек-листа «Приёмка вагона»', color: 'var(--s1)', kind: 'dot' }, { name: 'жалоб больше чем вдвое против обычного', color: 'var(--critical)', kind: 'dot' }]) + `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  const worst = out[0];
  return {
    find: `Пункт «${esc(worst.p.it.name)}» отмечают нарушением в ${fmt(worst.p.v, 1)}% чек-листов, но по его неисправности в пути пишут в ${fmt(worst.ratio, 1)} раза больше заявок, чем у других пунктов при той же доле нарушений. ` +
      'Проверяющий ставит «в порядке», не проверяя: пункт заполняют формально. Норматив пункта или способ проверки нужно пересмотреть.',
    side: '<div><h3>Как считается</h3><p>Для пункта берётся неисправность его норматива (check_list_item_norm.fault_type); пункт без неисправности в сравнение не входит. Серая линия - соотношение «нарушения в чек-листах : заявки в пути», типичное для всех пунктов.</p></div>',
    table: table(['Пункт', 'Нарушение в чек-листах', 'Заявок на 100 вагоно-рейсов', 'Против обычного'],
      out.map(({ p, ratio }) => [esc(p.it.name), fmt(p.v, 2) + '%', fmt(p.comp, 2), fmt(ratio, 1) + '×']), [1, 2, 3])
  };
}
