spring.application.name=zhsr-app

# Параметры подключения - в .env корня проекта
spring.config.import=optional:file:.env[.properties]

# Подключение к БД; пул соединений создаёт DbToolsConfig из kis-dbtools
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
connection.pool.size=5

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Сеанс - в cookie; SameSite=Lax: с чужих сайтов POST с cookie не придёт (защита от CSRF)
server.servlet.session.timeout=12h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Хранилище файлов S3 (фото заявок); параметры - в .env
s3.endpoint=${S3_ENDPOINT}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket=${S3_BUCKET}

# Загрузка фото: одно фото - до 20 МБ, запрос (заявка или пояснение с фото) - до 110 МБ
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=110MB

# Текст каждого SQL-запроса kis-dbtools пишет в лог на уровне INFO - выключено
logging.level.kz.kis.kisdbtools.repository.impl.JdbcDbImpl=WARN

# JSON: дробное число в целом поле (нормы часов, минуты) - ошибка 400, а не молча отброшенная дробная часть
spring.jackson.deserialization.accept-float-as-int=false
